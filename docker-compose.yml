services:
  encoder-predictor-train:
    build: .
    image: newmachinaai/newmachina_firefly_encoder_predictor_train:latest
    container_name: firefly_encoder_predictor_train
    command: ["container_encoder_predictor_train_src/firefly_encoder_predictor_train.py"]
    volumes:
      - ./data:/app/data

  encoder-inference:
    build: .
    image: newmachinaai/newmachina_firefly_encoder_inference:latest
    container_name: firefly_encoder_inference
    command: ["container_encoder_inference_src/firefly_encoder_inference.py", "--host", "0.0.0.0"]
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      encoder-predictor-train:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  predicter-inference:
    build: .
    image: newmachinaai/newmachina_firefly_predicter_inference:latest
    container_name: firefly_predicter_inference
    command: ["container_predicter_inference_src/firefly_predicter_inference.py", "--host", "0.0.0.0"]
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      encoder-predictor-train:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  policy-inference:
    build: .
    image: newmachinaai/newmachina_firefly_policy_inference:latest
    container_name: firefly_policy_inference
    command: ["container_policy_inference_src/firefly_policy_inference.py", "--host", "0.0.0.0", "--port", "8005"]
    ports:
      - "8005:8005"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      encoder-predictor-train:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  harness:
    build: .
    image: newmachinaai/newmachina_firefly_harness:latest
    container_name: firefly_harness
    command:
      [
        "container_harness_src/firefly_harness.py",
        "--encoder-url", "http://encoder-inference:8001",
        "--predictor-url", "http://predicter-inference:8002",
        "--policy-url", "http://policy-inference:8005",
        "--interval-ms", "100",
      ]
    # Raspberry Pi GPIO access for the light sensor (GPIO 17) and LED (GPIO 18)
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
    volumes:
      - ./data:/app/data:ro
    depends_on:
      encoder-inference:
        condition: service_healthy
      predicter-inference:
        condition: service_healthy
      policy-inference:
        condition: service_healthy
